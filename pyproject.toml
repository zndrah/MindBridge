[project]
name = "mindbridge"
version = "0.2.0"
description = "MindBridge 2.0: Agentic AI-Powered Mental Health First-Response and Knowledge-Grounded Support System"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "Adarsh Bandaru" }
]
dependencies = [
    "numpy>=2.0.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "tokenizers>=0.15.0",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "pandas>=3.1.0",
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.34.0",
    "groq>=1.7.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" }
]

[dependency-groups]
dev = [
    "kaggle>=2.2.5",
    "six>=1.17.0",
]
