# MindBridge 2.0 - Staging Reverse Proxy Configuration
# =======================================================
# Provides strict anti-spoofing header handling, non-root proxying,
# body size enforcement, and security headers.

server {
    listen 80;
    server_name localhost;

    # Match application body size limit (64 KB)
    client_max_body_size 64k;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    # Static frontend assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API endpoints reverse proxied to MindBridge FastAPI backend
    location ~ ^/(chat|health|ready|telemetry) {
        proxy_pass http://mindbridge-backend:8000;
        proxy_http_version 1.1;

        # Anti-spoofing forward header policy:
        # Sets X-Forwarded-For to the immediate upstream client address ($remote_addr)
        # rather than appending unverified incoming headers.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffer and timeout bounds
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
